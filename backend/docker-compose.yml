# ============================================
# PersonaOS Backend - Docker Compose
# ============================================

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: personaos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: personaos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personaos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - personaos-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: personaos-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - personaos-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personaos-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:1234@postgres:5432/personaos
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=change-me-in-production-use-a-secure-random-string
      - DEBUG=true
      - ENVIRONMENT=development
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173"]
      - LOG_LEVEL=INFO
      - LOG_FORMAT=console
    ports:
      - "8001:8000"
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - personaos-network

networks:
  personaos-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
